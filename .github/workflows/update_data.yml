name: Update BLS Michigan Employment Data

on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BLS ETL Pipeline
        run: python process_bls.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add michigan_employment.json
          git status
          git diff --staged --quiet || (git commit -m "Auto-update BLS employment data [skip ci]" && git push)
